<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" width="320" height="196" role="img" aria-labelledby="t">
  <title id="t">これまで：実行を 2 倍にするには人を 2 倍にするしかなく、判断も一緒に 2 倍になった。いま：実行だけが安くなり、実行は 10 倍にできるが、判断は 1 倍のまま。</title>
  <style>
    text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;font-size:13px;fill:#1c2422}
    .h{font-weight:700}
    .m{fill:#5a6562}
    .ex{fill:#16564a}
    .ju{fill:#234e70}
    .warn{fill:#9b3527}
    .br{stroke:#8b9491;stroke-width:1.5;fill:none}
    .sep{stroke:#dcdfda;stroke-width:1}
    @media (prefers-color-scheme:dark){
      text{fill:#e6eae7}.m{fill:#9ea8a4}
      .ex{fill:#6fbfa6}.ju{fill:#7aa9d4}.warn{fill:#e0857a}
      .br{stroke:#79837f}.sep{stroke:#2b3432}
    }
  </style>

  <text class="h" x="0" y="16">これまで — 人を 2 倍にする</text>
  <text class="m" x="0" y="45">実行</text><rect class="ex" x="48" y="34" width="20" height="14"/><rect class="ex" x="70" y="34" width="20" height="14"/><text class="m" x="96" y="45">×2</text>
  <text class="m" x="0" y="69">判断</text><rect class="ju" x="48" y="58" width="20" height="14"/><rect class="ju" x="70" y="58" width="20" height="14"/><text class="m" x="96" y="69">×2</text>
  <path class="br" d="M128 36 h8 v36 h-8"/>
  <text x="144" y="52">同じ人に付いていて、</text>
  <text x="144" y="70">一緒に増える</text>

  <line class="sep" x1="0" y1="96" x2="320" y2="96"/>

  <text class="h" x="0" y="124">いま — 実行だけが安くなる</text>
  <text class="m" x="0" y="153">実行</text><rect class="ex" x="48" y="142" width="20" height="14"/><rect class="ex" x="70" y="142" width="20" height="14"/><rect class="ex" x="92" y="142" width="20" height="14"/><rect class="ex" x="114" y="142" width="20" height="14"/><rect class="ex" x="136" y="142" width="20" height="14"/><rect class="ex" x="158" y="142" width="20" height="14"/><rect class="ex" x="180" y="142" width="20" height="14"/><rect class="ex" x="202" y="142" width="20" height="14"/><rect class="ex" x="224" y="142" width="20" height="14"/><rect class="ex" x="246" y="142" width="20" height="14"/><text class="m" x="272" y="153">×10</text>
  <text class="m" x="0" y="177">判断</text><rect class="ju" x="48" y="166" width="20" height="14"/><text class="m" x="74" y="177">×1</text>
  <text class="warn" x="104" y="177">判断は 10 倍にできない</text>
</svg>
